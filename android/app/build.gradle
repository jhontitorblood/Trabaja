plugins { id 'com.android.application' }

// Firma de producción opcional: se activa solo si el flujo de GitHub define estas variables.
def releaseKeystore = System.getenv('KEYSTORE_PATH')

android {
    namespace 'com.trabaja.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.trabaja.app'
        minSdk 23
        targetSdk 35
        versionCode 20
        versionName '2.0'
    }

    signingConfigs {
        // Clave de depuración estable y fija en el repositorio: así cada APK nuevo
        // se instala encima del anterior y conserva el progreso del jugador.
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
