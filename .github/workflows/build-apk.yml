name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'style.css'
      - 'manifest.json'
      - 'js/**'
      - 'assets/**'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar sintaxis del código web
        run: |
          set -euo pipefail
          for f in js/*.js; do node --check "$f"; done
          python3 tools/gen-sw.py
          node --check sw.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instalar paquetes del SDK de Android
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Copiar la app web dentro del APK
        run: |
          set -euo pipefail
          WWW=android/app/src/main/assets/www
          rm -rf "$WWW"
          mkdir -p "$WWW"
          cp index.html style.css manifest.json "$WWW"/
          cp -R js "$WWW"/js
          cp -R assets "$WWW"/assets

      - name: Compilar APK (firma estable de depuración)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Compilar APK de producción (solo si hay clave en los secretos)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" gradle assembleRelease --no-daemon

      - name: Reunir los APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Trabaja.apk
          if ls android/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*.apk dist/Trabaja-produccion.apk
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Trabaja-Android-APK
          path: dist/*.apk
          retention-days: 30
