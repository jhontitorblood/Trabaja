<!doctype html>
<html lang="es" data-theme="violet" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070910">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Trabaja: RPG de hábitos, enfoque, entrenamiento y evolución personal.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/img/icon-192.png">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="preload" href="assets/fonts/inter-400.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="assets/fonts/archivo-black.woff" as="font" type="font/woff" crossorigin>
<title>Trabaja</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient a1"></div><div class="ambient a2"></div>
<div id="splash" class="splash"><img src="assets/img/icon-192.png" alt=""><b>TRABAJA</b></div>
<canvas id="fxCanvas" aria-hidden="true"></canvas>
<div class="app-shell">
  <header class="topbar" id="topbar"></header>
  <main id="main" aria-live="polite"></main>
  <nav class="bottom-nav" id="nav" aria-label="Navegación principal"></nav>
</div>
<div id="overlay-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<dialog id="missionDialog" class="modal">
  <form id="missionForm" method="dialog" novalidate>
    <div class="dialog-head"><div><span class="eyebrow">TABLERO</span><h2 id="missionDialogTitle">Crear misión</h2></div><button type="button" class="icon-btn" data-act="closeMission" aria-label="Cerrar">✕</button></div>
    <label class="field">Nombre<input id="mName" maxlength="60" required placeholder="Ej. Preparar la presentación"></label>
    <label class="field">Descripción<input id="mDesc" maxlength="120" placeholder="Opcional"></label>
    <div class="two-col">
      <label class="field">XP<input id="mXP" type="number" min="5" max="500" step="5" value="25"></label>
      <label class="field">Prioridad<select id="mPriority"><option value="alta">Alta</option><option value="media" selected>Media</option><option value="baja">Baja</option></select></label>
    </div>
    <label class="field">Tipo<select id="mType"><option>Personal</option><option>Salud</option><option>Estudio</option><option>Trabajo</option><option>Disciplina</option></select></label>
    <label class="field">Subtareas (una por línea)<textarea id="mSubs" rows="3" maxlength="600" placeholder="Paso 1&#10;Paso 2"></textarea></label>
    <div class="setting-row"><span>Recordatorio diario</span><label class="switch"><input type="checkbox" id="mReminder"><i></i></label></div>
    <div class="two-col">
      <label class="field">Hora<input id="mTime" type="time" value="18:00"></label>
      <label class="field">Días<select id="mDays"><option value="all">Todos</option><option value="weekdays">Lunes a viernes</option><option value="weekend">Fin de semana</option></select></label>
    </div>
    <div class="modal-actions end"><button type="button" class="btn ghost" data-act="closeMission">Cancelar</button><button type="submit" class="btn primary" id="missionSubmit">Crear misión</button></div>
  </form>
</dialog>

<dialog id="reminderDialog" class="modal">
  <form id="reminderForm" method="dialog">
    <div class="dialog-head"><div><span class="eyebrow">RECORDATORIO</span><h2 id="rTitle">Misión</h2></div><button type="button" class="icon-btn" data-act="closeReminder" aria-label="Cerrar">✕</button></div>
    <div class="setting-row"><span>Activar aviso</span><label class="switch"><input type="checkbox" id="rEnabled"><i></i></label></div>
    <div class="two-col">
      <label class="field">Hora<input id="rTime" type="time" value="18:00"></label>
      <label class="field">Días<select id="rDays"><option value="all">Todos</option><option value="weekdays">Lunes a viernes</option><option value="weekend">Fin de semana</option></select></label>
    </div>
    <p class="muted small" id="rNote"></p>
    <div class="modal-actions end"><button type="button" class="btn ghost" data-act="closeReminder">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div>
  </form>
</dialog>

<dialog id="confirmDialog" class="modal"><div id="confirmBody"></div></dialog>

<script src="js/data.js"></script>
<script src="js/bosses.js"></script>
<script src="js/icons.js"></script>
<script src="js/state.js"></script>
<script src="js/fx.js"></script>
<script src="js/native.js"></script>
<script src="js/engine.js"></script>
<script src="js/views.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
